[package]
name = "esp32c6-geiger-embassy"
version = "0.2.0"
edition = "2024"

[[bin]]
name = "esp32c6-geiger-embassy"
path = "./src/main.rs"

[dependencies]
esp-bootloader-esp-idf = { version = "0.5.0", features = ["esp32c6"] }
esp-hal = { version = "1.1.2", features = ["esp32c6", "log-04", "unstable"] }
log = "0.4"
esp-rtos = { version = "0.3.0", features = [
    "esp32c6",
    "embassy",
    "esp-alloc",
    "log-04",
] }
embedded-io = "0.7"
embedded-io-async = "0.7"
esp-alloc = "0.10.0"
esp-println = { version = "0.17.0", features = ["esp32c6", "log-04"] }
critical-section = "1.2"
embassy-executor = { version = "0.10.0", features = ["log"] }
embassy-time = { version = "0.5.1", features = ["log"] }
embassy-sync = "0.8"
serde = { version = "1.0.229", features = ["derive"], default-features = false }

[profile.dev]
opt-level = "s"

[profile.release]
codegen-units = 1
debug = 2
debug-assertions = false
incremental = false
lto = 'fat'
opt-level = 's'
overflow-checks = false
